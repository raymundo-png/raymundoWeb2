<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>

    <body>

        <header style="background-color:lightgreen;text-align:center;padding:20px;">
            <h1>Student Registration Form</h1>
        </header>

        <nav style="background-color:pink;text-align:center;padding:20px;">
            <a href="home.html">Home</a> |
            <a href="registration.html">Registration Form</a> |
            <a href="grades.html">Grade Table</a> |
            <a href="profile.html">My Profile</a>
        </nav>

        <h3>Student Name</h3>
        <input type ="text" name ="First Name"/>

        <h3>Student Name</h3>
        <input type ="text" name ="Last Name"/>

        <h3>Email</h3>
        <input type ="text" name ="email"/>

        <h3>Gender</h3>
        <input type ="radio" name="gender" value="male">Male
        <input type ="radio" name="gender" value="female">Female

        <h3>Course</h3>
        <select name ="dropdown">
            <option value="BSCS" selected>BSCS</option>
            <option value="BSIT" selected>BSIT</option>
        </select>

        <h3>Skills</h3>
        <input type="Checkbox" name="HTML" value="on">HTML
        <input type="Checkbox" name="CSS" value="on">CSS
        <input type="Checkbox" name="JavaScript" value="on">JavaScript

        <h3>Upload Picture</h3>
        <input type="file" name="fileupload" accept="Image/*"/>

        <h3>Address</h3>
        <input type ="address" name ="address"/>

        <footer style="background-color: orange; padding: 5px; text-align:center;">
            Copyright C 2026
    </footer>


    </body>
</html>
